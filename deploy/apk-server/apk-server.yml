# APK 静态下载服务：自建 K3s 托管安卓安装包（GitHub Release 国内访问不稳，仅作拉取源）
# 对外地址：https://bff.515813.xyz/dl/app-v<版本>-<abi>.apk
# 同步方式：本文件内 apk-sync CronJob 每晚 4 点（北京时间）从 GitHub Release 拉最新规范版本的
#           分包到 PVC 的 dl 目录，两包齐才改写 API 库 Mobile.AppVersion（拉不完不宣告）；
#           CI 侧不再持有集群凭据，发布动作纯 GitHub 化
# 注意：PVC + replicas:1 —— 写文件的 CronJob 与读服务的 Deployment 同节点挂载（RWO 允许）；
#       如需高可用改用 RWX 存储或换对象存储，目前单副本足够
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openfindbearings-apk-server-pvc
  namespace: openfindbearings
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openfindbearings-apk-server-nginx
  namespace: openfindbearings
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /data;
      # 仅开放 /dl 前缀，APK 文件由 CI 推入 PVC 的 dl 目录
      location /dl/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
      }
      # 探活端点，供 liveness/readiness 使用
      location = /healthz {
        return 200 'ok';
      }
      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-apk-server
  namespace: openfindbearings
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: openfindbearings-apk-server
  template:
    metadata:
      labels:
        app: openfindbearings-apk-server
    spec:
      containers:
      - name: openfindbearings-apk-server
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: apk-storage
          mountPath: /data
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "16Mi"
            cpu: "10m"
      volumes:
      - name: apk-storage
        persistentVolumeClaim:
          claimName: openfindbearings-apk-server-pvc
      - name: nginx-conf
        configMap:
          name: openfindbearings-apk-server-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: openfindbearings-apk-server
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-apk-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# 改动说明：与 BFF 共用 bff.515813.xyz 域名（ingress-nginx 会合并同 host 多个 Ingress 的规则），
# 仅新增 /dl 路径；TLS 直接引用 Mobile 仓库 Ingress 已由 cert-manager 签发的 secret，
# 本资源不带 cert-manager 注解，避免对同一 host 重复签发证书
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfindbearings-apk-server-ingress
  namespace: openfindbearings
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - bff.515813.xyz
    secretName: bff-515813-xyz-tls
  rules:
  - host: bff.515813.xyz
    http:
      paths:
      - path: /dl
        pathType: Prefix
        backend:
          service:
            name: openfindbearings-apk-server
            port:
              number: 80
---
# 改动说明：拉取式版本同步——跨境推包(GitHub runner 到国内服务器)上行仅 ~50KB/s 且发布时阻塞 CI，
# 改为服务器侧 CronJob 每晚从 GitHub Release 拉包（下行速度波动、偶发连接重置，用重试循环+断点续传死磕），
# 两个分包全部就位后才改写 Mobile.AppVersion，保证"宣告即下载得到"
apiVersion: v1
kind: ConfigMap
metadata:
  name: openfindbearings-apk-sync-script
  namespace: openfindbearings
data:
  sync.sh: |
    #!/bin/sh
    # APK 同步脚本：从 GitHub Release 拉取最新规范版本分包，齐备后写库宣告新版
    # 完整性判定用 Release 资产自带的 sha256 digest（无 digest 字段则中止不宣告，防"空列表误判齐备"）
    set -u
    REPO="openfindbearings/OpenFindBearings.Taro"
    API="https://api.github.com/repos/$REPO"
    DL_DIR="/data/dl"
    log() { echo "[apk-sync] $*"; }
    mkdir -p "$DL_DIR"

    # 解析 ADO.NET 连接串 -> libpq 环境变量（凭据来自 openfindbearings-api-secrets）
    get() { echo "$CONN" | tr ';' '\n' | grep -m1 -i "^$1=" | cut -d= -f2-; }
    export PGHOST="$(get Host)" PGPORT="$(get Port)" PGDATABASE="$(get Database)" PGUSER="$(get Username)" PGPASSWORD="$(get Password)"

    # 1) 取最新规范版本：/releases 按发布时间倒序返回，过滤规范格式后取第一条即最新发布。
    #    （不用 sort -V 排版本序：busybox sort -V 把 v1.0.0-rc.12 排在正式版 v1.0.0 之后，
    #    违反 SemVer prerelease 规则；发布时间序与"发布即宣告最新"的业务语义天然一致）
    TARGET=$(wget -qO- "$API/releases?per_page=15" \
      | grep -o 'https://github.com/[^"]*app-v[^"]*-arm64-v8a\.apk' \
      | sed -E 's#.*app-(v.+)-arm64-v8a\.apk#\1#' \
      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
      | head -n1)
    if [ -z "$TARGET" ]; then
      log "无规范版本 Release（或 API 不可达），本轮跳过"
      exit 0
    fi

    # 2) 读服务端当前宣告版本
    CUR=$(psql -tA -c "SELECT \"Value\" FROM \"SystemConfigs\" WHERE \"Key\"='Mobile.AppVersion';" 2>/dev/null)
    log "target=$TARGET current=${CUR:-?}"

    # 3) 目标版本的资产清单：name + sha256 成对提取（JSON 内 name 先于 digest 出现，awk 配对）
    LISTF=/tmp/apk-assets.txt
    wget -qO- "$API/releases/tags/$TARGET" \
      | grep -oE '"name": "app-[^"]*\.apk"|"digest": "sha256:[0-9a-f]+"' \
      | awk -F'"' '/"name"/{n=$4} /"digest"/{if(n!=""){print n, substr($4,8); n=""}}' > "$LISTF"
    if [ ! -s "$LISTF" ]; then
      log "目标版本无带校验和的 APK 资产，中止（不宣告）"
      exit 1
    fi

    # 4) 逐包校验/下载：本地文件 sha256 匹配即视为就位；缺或损坏则 wget -c 断点续传下载，
    #    下完再校验，不匹配删除重来（下轮重拉）；任一未就位 -> 本轮不宣告
    # 改动说明：busybox wget 无 -t 重试选项且默认 90s 读超时，GitHub→国内链路速度波动、
    # 偶发连接重置(EAGAIN)易致单轮 wget 直接失败（实测坏窗口整晚白等）。改用 shell 重试循环：
    # -T 25 缩短读超时使 stall 尽快触发重试，-c 断点续传逐段累积，最多 40 次×间隔 3s 死磕到
    # 传完或触达 activeDeadlineSeconds；去掉原先 `| tail` 管道（那判的是 tail 退出码非 wget）
    MISS=0
    while read -r name hash; do
      [ -n "$name" ] || continue
      if [ -f "$DL_DIR/$name" ] && echo "$hash  $DL_DIR/$name" | sha256sum -c >/dev/null 2>&1; then
        continue
      fi
      log "下载 $name"
      n=0
      ok=0
      while [ "$n" -lt 40 ]; do
        if ( cd "$DL_DIR" && wget -c -T 25 -q "https://github.com/$REPO/releases/download/$TARGET/$name" ); then
          ok=1
          break
        fi
        n=$((n + 1))
        sleep 3
      done
      if [ "$ok" = 1 ]; then
        if echo "$hash  $DL_DIR/$name" | sha256sum -c >/dev/null 2>&1; then
          log "完成 $name"
        else
          log "校验和不匹配 $name，删除待下轮重拉"
          rm -f "$DL_DIR/$name"
          MISS=1
        fi
      else
        log "下载失败 $name（重试 $n 次），保留断点下轮续传"
        MISS=1
      fi
    done < "$LISTF"
    if [ "$MISS" = "1" ]; then
      log "分包未齐备，不宣告新版"
      exit 0
    fi

    # 5) 包齐且与当前宣告不一致 -> 写库（更新弹窗文案为固定模板，可在 Admin 系统配置页覆盖）
    if [ "$TARGET" != "$CUR" ]; then
      psql -c "UPDATE \"SystemConfigs\" SET \"Value\"='$TARGET', \"UpdatedAt\"=now() WHERE \"Key\"='Mobile.AppVersion';" \
        && psql -c "UPDATE \"SystemConfigs\" SET \"Value\"='发现新版本 $TARGET，建议更新', \"UpdatedAt\"=now() WHERE \"Key\"='Mobile.UpdateMessage';" \
        && log "Mobile.AppVersion 已宣告为 $TARGET"
    else
      log "已是最新，无需宣告"
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openfindbearings-apk-sync
  namespace: openfindbearings
spec:
  # 每晚 4 点（北京时间）一轮：3-5 点是中国→GitHub 国际出口拥堵谷底，慢速下载/重试在无人
  # 时段完成，最坏 ~90 分钟也在 5:30 前下完，早上 App 启动即可检测到昨夜发布的新版；Forbid 防重入
  schedule: "0 4 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # 单轮上限 90 分钟：好窗口约 25 分钟下完；坏窗口靠脚本内重试循环死磕，留足余量，
      # 到点仍下不完则本轮放弃、次日凌晨再续传（不宣告，保证"宣告即下载得到"）
      activeDeadlineSeconds: 5400
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: apk-sync
            # 复用 postgres 客户端镜像（自带 psql 与 busybox wget，单镜像零额外依赖）
            image: postgres:16-alpine
            command: ["/bin/sh", "/sync/sync.sh"]
            env:
            - name: CONN
              valueFrom:
                secretKeyRef:
                  name: openfindbearings-api-secrets
                  key: ConnectionStrings__DefaultConnection
            volumeMounts:
            - name: apk-storage
              mountPath: /data
            - name: sync-script
              mountPath: /sync
            resources:
              limits:
                memory: "64Mi"
                cpu: "200m"
              requests:
                memory: "32Mi"
                cpu: "50m"
          volumes:
          - name: apk-storage
            persistentVolumeClaim:
              claimName: openfindbearings-apk-server-pvc
          - name: sync-script
            configMap:
              name: openfindbearings-apk-sync-script
              defaultMode: 0755
