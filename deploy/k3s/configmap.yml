apiVersion: v1
kind: ConfigMap
metadata:
  name: openfindbearings-mobile-config
  namespace: openfindbearings
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Api__BaseUrl: "http://openfindbearings-api:80"
  Identity__Authority: "http://openfindbearings-identity:80"
  Identity__Audience: "api:mobile"
  # 改动说明：maui-client 统一重命名为 mobile-client
  Identity__ClientId: "mobile-client"
  # 改动说明：ClientSecret 已迁移到 openfindbearings-mobile-secrets（Secret），不再放 ConfigMap