name: Build Taro

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npx pnpm@8 install --frozen-lockfile

    - name: Build H5
      run: pnpm build:h5

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: taro-h5-build
        path: dist/
        retention-days: 7