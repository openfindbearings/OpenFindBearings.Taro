server {
    listen 80;
    server_name mobile.515813.xyz;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # 改动说明：新增 BFF 同源代理。H5 生产环境 getBaseUrl 返回空串走相对路径，
    # 请求打到 /mobile/* 由本 nginx 转发到 BFF Service（openfindbearings-mobile），
    # 与页面同源、免 CORS。此前 nginx 无此代理，线上 H5 拿不到 BFF 数据
    # （首页“热门轴承/推荐商家”两块空白）。
    # 采用主流静态 proxy_pass：K8s 里 Service 名只要有该 Service 对象即可解析出 ClusterIP
    # （与后端 Pod 是否就绪无关），启动即可用，无需 resolver 兜底。
    location /mobile/ {
        proxy_pass http://openfindbearings-mobile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 改动说明：移除原 expires 30d + Cache-Control immutable 长缓存。
    # app.js/app.css 文件名不带内容 hash，每次发版都是同名覆盖；一旦标 immutable，
    # 浏览器永不回源验证，老用户会一直跑旧包（本次线上 H5 白屏即此因）。
    # 改 no-cache：靠 ETag 回源验证，既保证发版即时生效，命中 304 时仍很快。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退；index.html 同样 no-cache，确保新构建的 chunk 引用被及时拉取
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
